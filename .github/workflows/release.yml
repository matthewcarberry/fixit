name: Release

# Every pull request merged into main releases a new version once CI passes on
# main. The merged pull request's label picks the size of the bump, counted
# from the newest v* tag:
#
#   no label       patch   0.3.0 -> 0.3.1
#   release:minor  minor   0.3.0 -> 0.4.0
#   release:major  major   0.3.0 -> 1.0.0
#   release:skip   no release
#
# The label has to be on the pull request when it merges. The workflow tags the
# merge commit, publishes the image to GitHub Container Registry and creates
# the GitHub release with notes generated from the merged pull requests.
#
# The version lives only in the tag: the image gets it as a build argument, so
# nothing is committed back to main (which only accepts pull requests).
#
# Pushing a tag like v0.4.0 by hand still works, for picking an exact version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # A tag pushed by hand, or a main push whose CI passed. Pull request CI runs are ignored.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Create the release labels
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create() {
            gh label list --limit 200 --json name --jq '.[].name' | grep -qx "$1" ||
              gh label create "$1" --color "$2" --description "$3"
          }
          create release:major B60205 "Merging releases a new major version (1.0.0 -> 2.0.0)"
          create release:minor FBCA04 "Merging releases a new minor version (0.3.0 -> 0.4.0)"
          create release:skip  CCCCCC "Merging doesn't release a new version"
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "$SHA is already tagged $(git tag --points-at "$SHA" | grep '^v'), so there is nothing to release."
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)
          if [ -n "$latest" ] && git merge-base --is-ancestor "$SHA" "$latest"; then
            echo "$latest already includes $SHA, so there is nothing to release."
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq "map(select(.merged_at != null and .merge_commit_sha == \"$SHA\")) | first | .number // empty")
          if [ -z "$pr" ]; then
            echo "$SHA didn't come from a merged pull request, so there is nothing to release."
            exit 0
          fi
          labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
          # shellcheck disable=SC2086 # one argument per label
          tag=$(python3 scripts/next-version.py "$latest" $labels)
          if [ -z "$tag" ]; then
            echo "#$pr has release:skip, so there is nothing to release."
            exit 0
          fi
          git tag "$tag" "$SHA"
          if ! git push origin "refs/tags/$tag"; then
            # Someone pushed the same tag by hand a moment ago; that push releases it.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag was just pushed by someone else, so there is nothing to release."
              exit 0
            fi
            exit 1
          fi
          echo "Tagged $SHA from #$pr as $tag (after ${latest:-no earlier tag})."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fixit
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
